<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #17100d; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Georgia, 'Times New Roman', serif; }
  #frame { position: relative; width: min(100vw, 1280px); aspect-ratio: 16 / 10; box-shadow: 0 24px 80px #000a; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #f4d9a8aa; font: 13px Georgia, serif; letter-spacing: .06em; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="stage" width="1280" height="800"></canvas>
  <div id="hint">CLICK A STATION OR WALK WITH WASD &middot; E TO USE &middot; 1-8 PICK INGREDIENT</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
